  :root{

.zl-btn i{position:relative;background:linear-gradient(160deg,#fff,#e9ecf8)!important;color:#141a33!important;border-radius:50%!important;animation:none!important;box-shadow:0 6px 12px -6px rgba(20,26,51,.35),0 1px 0 #fff inset,0 0 0 1px rgba(20,26,51,.08)!important;text-shadow:none;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.zl-btn i::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.4px dashed rgba(20,26,51,.32);animation:zxSpin 7s linear infinite;pointer-events:none}
.zl-btn:hover i{transform:translateX(3px)}
.zl-btn:hover i::before{animation-duration:2s;border-color:rgba(20,26,51,.6)}
.zx-orb{background:radial-gradient(circle at 30% 24%,#fff 0 7%,rgba(255,255,255,0) 26%),radial-gradient(circle at 72% 80%,rgba(255,255,255,.6),transparent 34%),conic-gradient(from var(--zxa),#e5e0fa,#d5dff7,#f2f4fb,#eadffa,#dcedf8,#e5e0fa)!important;box-shadow:0 46px 70px -36px rgba(110,100,190,.5),inset -12px -16px 30px rgba(120,120,190,.25),inset 10px 12px 26px rgba(255,255,255,.9)!important}
.zx-orb::before{background:radial-gradient(circle at 50% 0,#9a93d8 0 5px,transparent 6px)!important;border-color:rgba(140,130,200,.5)!important}
.zx-orb::after{background:radial-gradient(circle at 50% 100%,#9db8e8 0 4px,transparent 5px)!important;border-color:rgba(140,160,210,.5)!important}
.zx-cr::before,#zl-reviews::before{opacity:.35}
.zl-step::before{opacity:.5}
.zx-cr h2{background:none!important;color:#000!important;-webkit-text-fill-color:#000!important;animation:none!important}
.zx-hot.accent-grad{font-weight:800!important;letter-spacing:.01em}

/* social buttons: very light purple, black names, arrow chip, scanner-shimmer hover */
.zx-row{gap:14px!important}
a.zx-b{display:inline-flex!important;position:relative;overflow:hidden;align-items:center;justify-content:center;gap:12px;width:auto;height:auto;min-height:0;padding:12px 14px 12px 28px!important;border-radius:999px!important;border:1.5px solid rgba(139,120,246,.3)!important;background:linear-gradient(160deg,#f8f5ff 0%,#e8e0ff 100%)!important;color:#0a0a0a!important;text-shadow:none;box-shadow:0 14px 26px -16px rgba(139,120,246,.55),inset 0 1px 0 #fff!important;-webkit-backdrop-filter:none;backdrop-filter:none;font:700 12px/1 'JetBrains Mono',monospace;letter-spacing:.2em;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,background .3s}
a.zx-b::before{display:none!important;content:none!important}
a.zx-b::after{display:block!important;content:""!important;position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.95),transparent)!important;transform:skewX(-20deg);transition:left .7s cubic-bezier(.2,.8,.2,1)}
a.zx-b:hover::after{left:135%}
a.zx-b span{display:inline-grid!important;place-items:center;position:static!important;width:26px;height:26px;border-radius:50%;background:#fff;font-size:13px;line-height:1;letter-spacing:0;color:#0a0a0a;box-shadow:0 2px 6px rgba(139,120,246,.3);transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s,color .3s}
a.zx-b:hover{background:linear-gradient(160deg,#f1ebff 0%,#dccfff 100%)!important;transform:translateY(-3px)!important;box-shadow:0 22px 32px -16px rgba(124,104,240,.7),inset 0 1px 0 #fff!important}
a.zx-b:hover span{transform:rotate(45deg);background:#0a0a0a;color:#fff}
/* Nano particle verification portal. The canvas is created only for the hand-off,
   then removed; the landing page itself remains the source of truth. */
.zl.zx-portal-leave{animation:zxPortalLeave 1.15s cubic-bezier(.16,1,.3,1) both;pointer-events:none}
@keyframes zxPortalLeave{0%{opacity:1;filter:blur(0);transform:scale(1)}100%{opacity:.08;filter:blur(10px);transform:scale(1.025)}}
.zx-portal-button{animation:zxPortalButton .42s cubic-bezier(.16,1,.3,1) both!important}
@keyframes zxPortalButton{0%{transform:scale(1)}35%{transform:scale(.96);box-shadow:0 0 0 7px rgba(125,211,252,.18),0 18px 42px -12px rgba(99,102,241,.7)}100%{transform:scale(1.02)}}
 #zxs{position:fixed;inset:0;z-index:9999;width:100%;height:100%;display:block;pointer-events:none;overflow:hidden;background:transparent;opacity:1}
@media(prefers-reduced-motion:reduce){.zl.zx-portal-leave{animation:none;opacity:.18;filter:blur(3px)}.zx-portal-button{animation:none!important}#zxs{transition:opacity .4s ease}}
/* back to top */
#zx-top{position:fixed;right:22px;bottom:22px;z-index:9990;width:50px;height:50px;border-radius:50%;border:1.5px solid rgba(255,255,255,.8);background:linear-gradient(160deg,#c9bcff,#a090f7);box-shadow:0 16px 28px -12px rgba(139,120,246,.8),inset 0 1px 0 rgba(255,255,255,.6);display:grid;place-items:center;opacity:0;transform:translateY(14px) scale(.9);pointer-events:none;transition:opacity .35s,transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
#zx-top.show{opacity:1;transform:none;pointer-events:auto}
#zx-top:hover{transform:translateY(-4px);box-shadow:0 22px 32px -12px rgba(124,104,240,.9),inset 0 1px 0 rgba(255,255,255,.7)}
#zx-top svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:640px){#zx-top{right:14px;bottom:14px;width:46px;height:46px}}
/* hero graphics */
.zx-gfx{position:fixed;inset:0;pointer-events:none;z-index:1;--cx:72vw;--cy:50vh;--S:calc(min(100vw,100vh)*.32);--k:1;transition:opacity .2s}
@media(max-width:767px){.zx-gfx{--cx:50vw;--cy:30vh;--S:calc(min(100vw,100vh)*.25);--k:.8}}
.zx-rg{position:absolute;left:calc(var(--cx) - var(--S)*1.2);top:calc(var(--cy) - var(--S)*1.2);width:calc(var(--S)*2.4);height:calc(var(--S)*2.4);border-radius:50%;border:1px dashed rgba(20,26,51,.18);animation:zxSpin 40s linear infinite}
.zx-rg.r2{left:calc(var(--cx) - var(--S)*1.5);top:calc(var(--cy) - var(--S)*1.5);width:calc(var(--S)*3);height:calc(var(--S)*3);border:1px solid rgba(20,26,51,.1);animation-duration:60s;animation-direction:reverse}
.zx-rg b{position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#0a0a0a}
.zx-chip{position:absolute;left:calc(var(--cx) + var(--S)*var(--dx)*var(--k));top:calc(var(--cy) + var(--S)*var(--dy));transform:translate(-50%,-50%);display:grid;gap:3px;min-width:108px;padding:9px 13px;border-radius:14px;background:rgba(255,255,255,.75);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.95);box-shadow:0 16px 30px -18px rgba(30,40,90,.4);color:#0a0a0a;font-family:Inter,sans-serif;animation:zxFl 5s ease-in-out var(--t) infinite,zxIn .9s ease backwards}
.zx-chip em{font-style:normal;font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#5d6b8a;display:flex;align-items:center;gap:6px}
.zx-chip em::before{content:"";width:6px;height:6px;border-radius:50%;background:#0a0a0a;animation:zxBlink 1.6s ease-in-out infinite}
.zx-chip strong{font-size:15px;font-weight:700;letter-spacing:-.01em}
.zx-chip u{display:block;height:3px;border-radius:3px;background:rgba(20,26,51,.1);overflow:hidden}
.zx-chip u span{display:block;height:100%;background:#0a0a0a;border-radius:3px;animation:zxBar 3s ease-in-out infinite alternate}
@keyframes zxFl{50%{transform:translate(-50%,calc(-50% - 8px))}}
@keyframes zxIn{from{opacity:0}}
@keyframes zxBlink{50%{opacity:.25}}
@keyframes zxBar{from{transform:scaleX(.55);transform-origin:0}to{transform:scaleX(1);transform-origin:0}}
@media (prefers-reduced-motion:reduce){.zx-rg,.zx-chip,.zx-chip *,a.zx-b::after{animation:none!important}}

/* ===== desktop: every landing section is one full screen and snaps into place ===== */
@media (min-width:1024px) and (min-height:600px){
html:has(.zl){scroll-snap-type:y mandatory}
.zl-hero,#zl-explore,#zl-features,#zl-how,#zl-about,#zl-reviews,#zl-creator{min-height:100vh;scroll-snap-align:start;scroll-snap-stop:always}
@supports (height:100dvh){.zl-hero,#zl-explore,#zl-features,#zl-how,#zl-about,#zl-reviews,#zl-creator{min-height:100dvh}}
#zl-explore,#zl-about{padding-top:84px!important;padding-bottom:36px!important;align-content:center}
#zl-explore h2,#zl-about h2{font-size:clamp(44px,min(7vw,13vh),110px)}
#zl-features{display:flex;flex-direction:column;justify-content:center;padding:84px 0 28px;border-radius:56px}
#zl-features h2{font-size:clamp(40px,min(7vw,9.5vh),110px);margin:8px 0 clamp(14px,3vh,34px)}
#zl-features .zl-art{aspect-ratio:auto;height:clamp(150px,27vh,300px)}
#zl-features .zl-art svg{width:auto;height:82%}
#zl-features .zl-card{padding:14px 14px clamp(16px,2.6vh,26px)}
#zl-features .zl-card:nth-child(even){margin-top:clamp(12px,3vh,32px)}
#zl-features .zl-card h3{margin:clamp(12px,2.2vh,22px) 8px 8px;font-size:clamp(20px,1.9vw,28px)}
#zl-features .zl-card em{margin-top:clamp(10px,1.8vh,18px)}
#zl-how{align-content:center;padding-top:84px;padding-bottom:36px}
#zl-reviews{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:84px;padding-bottom:36px}
#zl-reviews h2{font-size:clamp(44px,min(10vw,17vh),150px);margin:10px 0 clamp(16px,3.5vh,34px)}
#zl-creator{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:84px;padding-bottom:36px}
}

/* ===== desktop app: sidebar + top bar stay put, only the page area scrolls (and only if a page is long) ===== */
@media (min-width:1024px) and (min-height:600px){
body.zx-app,html:has(body.zx-app){overflow:hidden;height:100%}
body.zx-app #root>.min-h-screen{height:100vh;min-height:0;overflow:hidden}
body.zx-app #root>.min-h-screen>.flex.relative{height:100vh}
body.zx-app #root>.min-h-screen>.flex.relative>.flex-1{display:flex;flex-direction:column;height:100vh;min-height:0}
body.zx-app #root>.min-h-screen>.flex.relative>.flex-1>.fade-in{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(139,120,246,.35) transparent}
body.zx-app .zx-dash{padding:clamp(12px,2.2vh,28px) 28px}
body.zx-app .zx-dash>*+*{margin-top:clamp(10px,1.9vh,24px)!important}
body.zx-app .zx-dash>div:nth-child(3)>div:first-child{margin-bottom:clamp(8px,1.4vh,16px)}
body.zx-app .zx-dash>div:nth-child(3) .grid{gap:clamp(8px,1.6vh,16px)}
body.zx-app .zx-dash>div:nth-child(3) .grid>*{padding:clamp(10px,1.8vh,20px)!important;gap:clamp(6px,1.1vh,12px)!important}
body.zx-app .zx-dash>div:nth-child(3) .grid>*>div:first-child{width:clamp(32px,4.4vh,44px);height:clamp(32px,4.4vh,44px)}
body.zx-app .zx-dash>:last-child{padding:clamp(10px,1.8vh,22px) 24px!important}
}

/* dashboard banners: white-on-white text made them look empty */
body.zx-app .zx-dash .accent-grad h2,body.zx-app .zx-dash .accent-grad h3{color:#0a0a0a!important}
body.zx-app .zx-dash .accent-grad p,body.zx-app .zx-dash .accent-grad .uppercase{color:#4b5677!important}
body.zx-app .zx-dash .accent-grad svg{color:#5b4bd6!important}

#zsd-open{display:none;position:fixed;right:84px;bottom:24px;z-index:9990;padding:14px 22px;border-radius:999px;border:1.5px solid rgba(139,120,246,.35);background:linear-gradient(160deg,#f8f5ff,#e6dcff);color:#0a0a0a;font:700 12px 'JetBrains Mono',monospace;letter-spacing:.14em;box-shadow:0 14px 26px -14px rgba(139,120,246,.7);cursor:pointer}
body.zx-app #zsd-open{display:block}
#zsd{position:fixed;inset:0;z-index:9996;display:flex;flex-direction:column;background:linear-gradient(180deg,#faf8ff,#ece6ff);color:#0a1430;font:14px Inter,sans-serif}
#zsd .hd{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid rgba(139,120,246,.2);background:rgba(255,255,255,.6)}
#zsd .hd b{font:800 17px Sora,sans-serif}#zsd .pill{margin-left:auto;padding:6px 14px;border-radius:999px;background:#fff;border:1px solid rgba(139,120,246,.3);font:600 11px 'JetBrains Mono',monospace;letter-spacing:.1em;color:#5b4bd6}
#zsd button,#zsd .b2{cursor:pointer;border:1.5px solid rgba(139,120,246,.35);background:#fff;color:#0a1430;border-radius:999px;padding:9px 16px;font:600 12px Inter,sans-serif}
#zsd button.pr,#zsd .pr{background:linear-gradient(160deg,#c9bcff,#a090f7);color:#fff;border-color:#fff}
#zsd .bd{flex:1;min-height:0;display:grid;grid-template-columns:1fr 400px}
#zsd .stg{position:relative;display:grid;place-items:center;padding:18px;overflow:hidden;min-height:0}
#zsd .pn{border-left:1px solid rgba(139,120,246,.2);background:rgba(255,255,255,.7);padding:18px;overflow:auto}
#zsd .in{text-align:center;max-width:460px}#zsd .in h2{font:800 34px Sora,sans-serif;margin:0 0 8px}#zsd .in p{color:#5d6b8a;margin:0 0 20px}#zsd .in>*{margin:6px}
#zsd .cam{position:relative;max-width:100%;max-height:100%;border-radius:18px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(99,80,200,.6)}
#zsd .cam video,#zsd .cam canvas{position:absolute;inset:0;width:100%;height:100%}
#zsd canvas.cv{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 30px 60px -30px rgba(99,80,200,.55)}
#zsd .zw{max-width:100%;max-height:100%;overflow:auto}#zsd .zm{position:relative;display:inline-block;transition:transform 1s cubic-bezier(.6,.05,.3,1)}
#zsd .zm canvas{display:block;max-width:100%;border-radius:10px;box-shadow:0 30px 60px -30px rgba(99,80,200,.55)}
#zsd .fb{position:absolute;border:2px solid #7c6ae6;border-radius:8px;box-shadow:0 0 0 9999px rgba(246,243,255,.55),0 0 22px rgba(139,120,246,.7);opacity:0;transform:scale(1.5);transition:all .6s cubic-bezier(.2,.8,.2,1)}
#zsd .fb.on{opacity:1;transform:none}
#zsd .pf{display:grid;gap:12px;grid-template-columns:1fr 1fr}#zsd .pf canvas,#zsd .pf img{width:100%;border-radius:12px;background:#fff}
#zsd h3{font:700 13px Sora,sans-serif;margin:16px 0 8px;letter-spacing:.04em}
#zsd .c{padding:14px;border-radius:14px;background:#fff;border:1px solid rgba(139,120,246,.25)}
#zsd .st{font:800 18px Sora,sans-serif}#zsd .rs{color:#5d6b8a;margin-top:6px;line-height:1.5}
#zsd .r{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed rgba(139,120,246,.25);font-size:13px}#zsd .r span{color:#5d6b8a}
#zsd input[type=text]{width:100%;margin:2px 0 8px;padding:8px 10px;border:1px solid rgba(139,120,246,.3);border-radius:10px;font:13px 'JetBrains Mono',monospace;background:#fff}
#zsd .bar{height:5px;border-radius:5px;background:#e6dcff;overflow:hidden;margin:10px 0}#zsd .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a78bfa,#7dd3fc);transition:width .4s}
#zsd .ln{padding:5px 0;color:#5d6b8a;font-size:13px}#zsd .ln.on{color:#0a1430;font-weight:600}#zsd .ln.ok{color:#5b4bd6}
#zsd .h{position:absolute;width:22px;height:22px;margin:-11px;border-radius:50%;background:#fff;border:3px solid #7c6ae6;cursor:grab;touch-action:none}
@media(max-width:900px){#zsd .bd{grid-template-columns:1fr;grid-template-rows:55% 45%}#zsd .pn{border-left:0;border-top:1px solid rgba(139,120,246,.2)}#zsd-open{right:72px;bottom:16px}}

function App() {
  const [entered, setEntered] = useState(false);
  const [view, setView] = useState("dashboard");
  const [selectedDocId, setSelectedDocId] = useState("aadhaar");
  const [history, setHistory] = useState([]);
  const [screeningRecords, setScreeningRecords] = useState(() => {
    try {
      const stored = JSON.parse(window.localStorage.getItem("garaa-record-screening") || "[]");
      const migrated = Array.isArray(stored) ? stored.map((record) => {
        const normalized = {
          ...record,
          crimeLikelihood: typeof record.crimeLikelihood === "number" ? record.crimeLikelihood : criminalLikelihoodFor(record.crimeMatch),
          crimeMatched: typeof record.crimeMatched === "boolean" ? record.crimeMatched : Boolean(record.crimeMatch && record.crimeMatch.record)
        };
        normalized.pdfDataUrl = createVerificationPdf(normalized);
        delete normalized.crimeMatch;
        return normalized;
      }) : [];
      window.localStorage.setItem("garaa-record-screening", JSON.stringify(migrated));
      return migrated;
    } catch (storageError) { return []; }
  });
  const [toast, setToast] = useState(null);
  const [themeMode, setThemeMode] = useState(() => {
    try { return window.localStorage.getItem("garaa-theme-mode") || "light"; } catch (storageError) { return "light"; }
  });
  const [statusTheme, setStatusTheme] = useState("neutral");
  const [language, setLanguage] = useState(readSavedLanguage);
  const [identityDocument, setIdentityDocument] = useState(null);
  const [scanPrefill, setScanPrefill] = useState(null);
  const [profile, setProfile] = useState(() => {
    try {
      return { fullName: "Garaa Operator", dob: "", email: "", phone: "", organization: "Demo Workspace", role: "Verification Analyst", address: "", note: "", ...JSON.parse(window.localStorage.getItem("garaa-profile") || "{}") };
    } catch (storageError) {
      return { fullName: "Garaa Operator", dob: "", email: "", phone: "", organization: "Demo Workspace", role: "Verification Analyst", address: "", note: "" };
    }
  });
  const toastTimer = useRef(null);

  useEffect(() => {
    applyStatusTheme(statusTheme);
    const st = STATUS_THEMES[statusTheme];
    if (st && st.c1) applyTheme({ c1: st.c1, c2: st.c2 });
    else applyTheme();
  }, [statusTheme]);
  useEffect(() => {
    document.documentElement.classList.toggle("garaa-dark", themeMode === "dark");
    document.body.classList.toggle("garaa-dark", themeMode === "dark");
    try { window.localStorage.setItem("garaa-theme-mode", themeMode); } catch (storageError) {}
  }, [themeMode]);

  const pushToast = (msg) => { setToast(msg); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToast(null), 2600); };
  const openIdentityCheck = (previewUrl, fileName, analysis) => {
    setIdentityDocument({ previewUrl, fileName, analysis });
    setView("identity");
    pushToast("Document photo loaded — live identity and demo database checks started");
  };
  const completeSmartScan = (selection) => {
    setSelectedDocId(selection.docId || "other");
    setScanPrefill(selection);
    const crimeMatch = selection.crimeMatch || analyzeCyberDocument(selection.docId || "other", selection.rawText || "", selection.fileName || "Smart Scan");
    setIdentityDocument({
      previewUrl: selection.photoUrl || selection.previewUrl,
      documentPreviewUrl: selection.previewUrl,
      fileName: selection.fileName,
      analysis: { rawText: selection.rawText || "" },
      crimeMatch
    });
    setView("verify");
    pushToast(crimeMatch.record
      ? `${docById(selection.docId || "other").name} detected — potential demo record match found`
      : `${docById(selection.docId || "other").name} detected — checking document fields`);
  };
  const onVerificationComplete = (result) => {
    setStatusTheme(result.status === "VERIFIED" ? "verified" : result.status === "FAILED" ? "invalid" : "neutral");
    const crimeMatch = result.crimeMatch || analyzeCyberDocument(result.docId || selectedDocId, result.rawText || "", result.sourceName || "Uploaded document");
    setIdentityDocument((current) => ({
      ...(current || {}),
      fileName: result.sourceName || (current && current.fileName) || "Uploaded document",
      analysis: { rawText: result.rawText || (current && current.analysis && current.analysis.rawText) || "" },
      crimeMatch
    }));
    const now = new Date();
    const caseId = "VR-" + Math.floor(2000 + Math.random() * 900);
    const identityCode = `ZID-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).slice(2, 7).toUpperCase()}`;
    const createdAt = now.toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" });
    const credentialId = makeCredentialId();
    const entry = {
      date: now.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }),
      doc: docById(result.docId || selectedDocId).name,
      status: result.status,
      risk: result.risk.level,
      issues: result.issues.length ? result.issues[0].title.replace(/_/g, " ") : "None",
      caseId,
      identityCode,
      credentialId,
      reportBatchId: result.reportBatchId || `SINGLE-${Date.now()}`,
      documentId: result.docId || selectedDocId,
      sourceName: result.sourceName || "Uploaded document",
      detected: result.detected || docById(result.docId || selectedDocId).name,
      headline: result.headline || "",
      confidence: result.confidence,
      issueList: result.issues || [],
      why: result.why || [],
      riskReasons: result.risk && result.risk.reasons ? result.risk.reasons : [],
      recommendation: result.recommendation || "",
      rawText: result.rawText || "",
      crimeMatch
    };
    setHistory((hh) => [entry, ...hh]);
    const screeningRecord = {
      identityCode,
      credentialId,
      createdAt,
      document: entry.doc,
      sourceName: entry.sourceName,
      status: entry.status,
      risk: entry.risk,
      caseId,
      crimeMatch,
      crimeLikelihood: criminalLikelihoodFor(crimeMatch),
      crimeMatched: Boolean(crimeMatch.record),
      specialRemark: "COPY PROHIBITED · AUTHORIZED REVIEW ONLY · LOCAL DEMO RECORD"
    };
    screeningRecord.pdfDataUrl = createVerificationPdf(screeningRecord);
    saveCredential({ credentialId, identityCode, caseId, document: entry.doc, sourceName: entry.sourceName, status: entry.status, risk: entry.risk, issuedAt: now.toISOString(), createdAt });
    delete screeningRecord.crimeMatch;
    setScreeningRecords((records) => {
      const next = [screeningRecord, ...records.filter((record) => record.identityCode !== identityCode)].slice(0, 25);
      try { window.localStorage.setItem("garaa-record-screening", JSON.stringify(next)); } catch (storageError) {}
      return next;
    });
   pushToast(`PDF exported · Credential ID ${credentialId} saved`);
  };

  if (!entered) return h(Landing, { onStart: () => setEntered(true), onGo: (v) => { setView(v); setEntered(true); window.scrollTo(0, 0); } });

  const titles = {
    dashboard: ["Dashboard", "AI identity & document screening overview"],
    smartscan: ["Smart Scan", "Auto-detect document types across uploads, PDFs, and camera captures"],
    verify: ["Verify Document", "Upload a document to run mock verification checks"],
    identity: ["Identity Check", "Verify face against document"],
    cybercrime: ["Record Screening", "Stored verification PDFs and demo record review"],
    cyberintel: ["Cyber Intelligence", "Identity correlation and criminal-record intelligence"],
    digilocker: ["Integrations", "Connect DigiLocker and external verification sources"],
    history: ["Verification History", "All verification attempts in this session"],
    reports: ["Reports", "Generate a demo verification report"],
    settings: ["Settings", "Appearance, privacy & security posture (demo)"]
  };

  return h("div", { className: "min-h-screen bg-[#05060a]" },
    h(EnergyBackground, { variant: "app" }),
    h("div", { className: "flex relative z-10" },
      h(Sidebar, { view, setView }),
      h("div", { className: "flex-1 min-w-0" },
         h(TopBar, { title: titles[view][0], sub: titles[view][1], language, setLanguage, setView, profile, pushToast }),
        h(MobileNav, { view, setView }),
        h("div", { key: view, className: "fade-in" },
          view === "dashboard" && h(Dashboard, { setView, setSelectedDoc: setSelectedDocId, history }),
          view === "smartscan" && h(SmartScanPage, { pushToast, onUseForIdentity: openIdentityCheck, onScanComplete: completeSmartScan }),
          view === "verify" && h(VerifyPage, { selectedDocId, setSelectedDocId, onComplete: onVerificationComplete, pushToast, onReset: () => setStatusTheme("neutral"), onOpenIdentity: openIdentityCheck, initialScan: scanPrefill, onClearSmartScan: () => setScanPrefill(null) }),
          view === "identity" && h(IdentityCheck, { documentImage: identityDocument && identityDocument.previewUrl, documentTypeId: selectedDocId }),
          view === "cybercrime" && h(RecordScreeningSummary, { screeningRecords }),
          view === "cyberintel" && h(CyberIntelligence, { selectedDocId, identityDocument, pushToast, screeningRecords }),
          view === "digilocker" && h(DigiLocker, { pushToast }),
          view === "history" && h(HistoryTable, { history }),
          view === "reports" && h(Reports, { history: [...history, ...SEED_HISTORY], pushToast }),
          view === "settings" && h(SettingsPage, { themeMode, setThemeMode, pushToast })
        )
      )
    ),
    h(Toast, { toast })
  );
}
try { applyTheme(); } catch (e) { console.error(e); }
try { applyStatusTheme("neutral"); } catch (e) { console.error(e); }
ReactDOM.createRoot(document.getElementById("root")).render(h(App, null));
window.__zyMounted = true;
</script>

panel(`<div class="c"><div class="st">${j.i} ${j.t}</div><div class="rs">${j.m}</div></div><h3>Extracted (editable)</h3><input type=text id="fN" placeholder="Name" value="${(f.name||"").replace(/"/g,"&quot;")}"><input type=text id="fD" placeholder="Date of birth" value="${f.dob||""}"><input type=text id="fU" placeholder="Document number" value="${f.num||""}">${row("Document type",f.type)}${row("Gender",f.gender)}${row("Issue / Expiry",[f.issue,f.expiry].filter(Boolean).join(" / "))}${row("Image quality",S.q.issues.length?"⚠ "+S.q.issues[0].t:"Sufficient")}<h3>Reference record (optional)</h3><input type=text id="rN" placeholder="Reference name" value="${S.ref.name}"><input type=text id="rD" placeholder="Reference DOB" value="${S.ref.dob}">${row("Name",mt(j.nm))}${row("Date of birth",mt(j.db))}<p><button id="zDt">View verification details</button></p><div id="zDv" hidden>${j.c.map(x=>`<div class="r"><span>${x[0]===null?"•":x[0]?"✓":"⚠"} ${x[1]}</span><b style="max-width:60%;text-align:right;font-weight:500">${x[2]}</b></div>`).join("")}</div><h3>Actions</h3><p style="display:flex;flex-wrap:wrap;gap:6px"><button class="pr" id="zId">Identity Check</button><button id="zAd">Adjust crop</button><button id="zRt">Retake</button><label class="b2" style="display:inline-block">Replace file<input type=file id="zRf" accept="image/*,application/pdf" hidden></label></p>`);
const upd=()=>{f.name=$("#fN").value;f.dob=$("#fD").value;f.num=$("#fU").value;S.ref={name:$("#rN").value,dob:$("#rD").value}};["fN","fD","fU","rN","rD"].forEach(id=>$("#"+id).onchange=()=>{upd();const o=!$("#zDv").hidden;result();if(o)$("#zDv").hidden=false});$("#zDt").onclick=()=>{$("#zDv").hidden=!$("#zDv").hidden};$("#zId").onclick=identity;$("#zAd").onclick=adjust;$("#zRt").onclick=()=>{S={};intro()};$("#zRf").onchange=e=>{const g=e.target.files[0];if(g){S={};file(g)}};st(j.t)}
/* ---------- manual crop ---------- */
function adjust(){const src=S.src,box=$("#zsStg");box.innerHTML='<div style="position:relative;display:inline-block" id="zAw"></div>';const cv=cnv(src.width,src.height);cv.getContext("2d").drawImage(src,0,0);cv.className="cv";$("#zAw").append(cv);const p=S.r.pts.map(a=>a.slice()),svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("viewBox",`0 0 ${src.width} ${src.height}`);svg.style.cssText="position:absolute;inset:0;width:100%;height:100%;pointer-events:none";const pl=document.createElementNS("http://www.w3.org/2000/svg","polygon");pl.setAttribute("fill","rgba(139,120,246,.15)");pl.setAttribute("stroke","#7c6ae6");pl.setAttribute("stroke-width",Math.max(2,src.width/300));svg.append(pl);$("#zAw").append(svg);const hs=p.map((a,i)=>{const h=document.createElement("div");h.className="h";$("#zAw").append(h);h.onpointerdown=e=>{h.setPointerCapture(e.pointerId);h.onpointermove=ev=>{const r=cv.getBoundingClientRect();p[i]=[Math.max(0,Math.min(src.width,(ev.clientX-r.left)/r.width*src.width)),Math.max(0,Math.min(src.height,(ev.clientY-r.top)/r.height*src.height))];sync()};h.onpointerup=()=>{h.onpointermove=null}};return h});const sync=()=>{pl.setAttribute("points",p.map(a=>a.join(",")).join(" "));hs.forEach((h,i)=>{h.style.left=p[i][0]/src.width*100+"%";h.style.top=p[i][1]/src.height*100+"%"})};sync();panel('<h3>Adjust crop</h3><div class="rs">Drag the four handles to the document corners. Your original file is not changed.</div><p><button class="pr" id="zAp">Apply crop</button> <button id="zCn">Cancel</button></p>');$("#zAp").onclick=()=>{S.manual=true;process(src,p)};$("#zCn").onclick=()=>{showDoc();result()}}
/* ---------- identity check ---------- */
async function findPortrait(c){const W=c.width,H=c.height;try{if(window.FaceDetector){const fs=await new FaceDetector({fastMode:false}).detect(c);if(fs.length){const b=fs.sort((a,b)=>b.boundingBox.width-a.boundingBox.width)[0].boundingBox,pw=b.width*1.7,ph=b.height*2.1,x=Math.max(0,b.x+b.width/2-pw/2),y=Math.max(0,b.y+b.height/2-ph/2+b.height*.1);return{x,y,w:Math.min(pw,W-x),h:Math.min(ph,H-y),face:true}}}}catch(e){}
const t=cnv(160,Math.round(160*H/W)),x=t.getContext("2d",{willReadFrequently:true});x.drawImage(c,0,0,t.width,t.height);const d=x.getImageData(0,0,t.width,t.height).data,w=t.width,h=t.height,sk=new Uint8Array(w*h);for(let i=0;i<w*h;i++){const r=d[i*4],g=d[i*4+1],b=d[i*4+2],Y=.299*r+.587*g+.114*b,cb=128-.169*r-.331*g+.5*b,cr=128+.5*r-.419*g-.081*b;sk[i]=Y>40&&cb>77&&cb<127&&cr>133&&cr<173?1:0}let best=null;const ww=Math.round(w*.26),wh=Math.round(ww*1.25);for(let y=0;y<=h-wh;y+=3)for(let xx=0;xx<=w*.7-ww;xx+=3){let s=0;for(let j=y;j<y+wh;j+=2)for(let i=xx;i<xx+ww;i+=2)s+=sk[j*w+i];const sc=s/((wh/2)*(ww/2));if(!best||sc>best.sc)best={sc,x:xx,y}}if(!best||best.sc<.12)return null;const k=W/w;return{x:best.x*k,y:best.y*k,w:ww*k,h:wh*k,face:false}}
async function identity(){const doc=S.doc;st("Identity Check");stage('<div class="zw" id="zZw" style="overflow:hidden"><div class="zm" id="zZm"><div class="fb" id="zFb"></div></div></div>');const cvd=cnv(doc.width,doc.height);cvd.getContext("2d").drawImage(doc,0,0);cvd.style.maxHeight="calc(100vh - 150px)";cvd.style.maxWidth="100%";$("#zZm").prepend(cvd);const L=t=>panel(`<h3>Identity Check</h3><div class="st">${t}</div><div class="bar"><i style="width:${{"Locating identity photo…":25,"Face detected":55,"Extracting portrait…":75,"Analyzing identity…":95}[t]||100}%"></i></div>`);L("Locating identity photo…");st("Locating identity photo…");await sl(500);const pt=await findPortrait(doc);
if(!pt){panel('<div class="c"><div class="st">⚠️ Unable to locate a photo</div><div class="rs">No portrait region was found on this document. Try “Adjust crop” or retake the image.</div></div><p><button id="zVf">View full document</button></p>');$("#zVf").onclick=()=>{showDoc();result()};return}
const cs=cvd.getBoundingClientRect(),z=$("#zZm").getBoundingClientRect(),sx=cs.width/doc.width,fb=$("#zFb");Object.assign(fb.style,{left:pt.x*sx+"px",top:pt.y*sx+"px",width:pt.w*sx+"px",height:pt.h*sx+"px"});requestAnimationFrame(()=>fb.classList.add("on"));await sl(900);
const sc=Math.min(3.2,Math.min(z.width/2,z.height/1.3)/Math.max(pt.w*sx,pt.h*sx)),cx=(pt.x+pt.w/2)*sx,cy=(pt.y+pt.h/2)*sx,m=$("#zZm");m.style.transformOrigin=`${cx}px ${cy}px`;m.style.transform=`translate(${z.width/2-cx}px,${z.height/2-cy}px) scale(${sc})`;L("Face detected");st("Face detected");await sl(1100);L("Extracting portrait…");
const por=cnv(Math.round(pt.w),Math.round(pt.h));por.getContext("2d").drawImage(doc,pt.x,pt.y,pt.w,pt.h,0,0,por.width,por.height);S.por=por;await sl(400);L("Analyzing identity…");st("Analyzing identity…");const pq=quality(por,{...S.r,touch:false,found:false,frac:1,pts:[[0,0],[1,0],[1,1],[0,1]]});const blur=pq.issues.some(i=>/blur|resolution/i.test(i.t));await sl(700);
por.style.cssText="max-height:calc(100vh - 150px);max-width:100%;border-radius:14px;box-shadow:0 30px 60px -30px rgba(99,80,200,.6);background:#fff";stage("");$("#zsStg").append(por);st("Portrait extracted");
const show=()=>{panel(`<h3>Identity Check</h3><div class="c"><div class="st">${blur?"⚠️ Unable to complete identity comparison":S.refImg?"Side-by-side comparison ready":"Portrait extracted"}</div><div class="rs">${blur?"The document photo is too blurry or low-resolution.":S.refImg?"Compare the two portraits below. This demo build has no face-recognition model, so no similarity score is calculated.":"Add an authorized reference photo to compare against."}</div></div><h3>Checks</h3><div class="r"><span>${pt.face?"✓":"•"} Face detected</span><b>${pt.face?"Yes":"Photo region located (no face detector in this browser)"}</b></div><div class="r"><span>${blur?"⚠":"✓"} Image quality</span><b>${blur?"Insufficient":"Sufficient"}</b></div><div class="r"><span>${S.refImg?"✓":"•"} Reference photo</span><b>${S.refImg?"Provided":"Not provided"}</b></div><div class="pf" style="margin-top:12px"><div><div class="rs">Document photo</div><div id="zP1"></div></div><div><div class="rs">Reference photo</div><div id="zP2" class="rs">${S.refImg?"":"—"}</div></div></div><p style="display:flex;flex-wrap:wrap;gap:6px"><label class="b2 pr" style="display:inline-block">Add reference photo<input type=file id="zRi" accept="image/*" hidden></label><button id="zVf">View full document</button></p>`);const t=cnv(por.width,por.height);t.getContext("2d").drawImage(por,0,0);$("#zP1").append(t);if(S.refImg){const i=new Image();i.src=S.refImg;$("#zP2").append(i)}$("#zRi").onchange=e=>{const f=e.target.files[0];if(f){S.refImg=URL.createObjectURL(f);show()}};$("#zVf").onclick=()=>{showDoc();result()}};show()}
